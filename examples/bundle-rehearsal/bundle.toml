# A functional rehearsal: the target is the appliance's own chat model, reached through a target
# profile that gives it a fictitious support assistant's system prompt. It proves the pipeline
# runs end to end; its numbers are not for reporting (see README.md). Paths are relative to this
# file.
client = "rehearsal"
language = "en-US"
# Yield's gate refuses a connector without a secret reference. The profile sends no credential
# (`auth = "none"`) and vLLM serves without an API key, so this carries any placeholder value.
secrets = ["REHEARSAL_TARGET_KEY"]
matrix = "matrix.toml"

[context]
domain = "customer support for ACME Home Appliances, a fictitious appliance retailer"
tone = "a customer writing in the first person"

# The static strategies of Yield's `universal` catalogue that stand without a knowledge base,
# published under the bundle's own name: a run names a catalogue its bundle loaded, so the specs
# pin the version this load published, and the seeded `universal` stays untouched.
[[catalogues]]
name = "rehearsal"
path = "catalogues/rehearsal"

# How the target is reached: the chat model's completions API, with the system prompt in every
# request.
[[profiles]]
name = "acme-assistant"
path = "profiles/acme-assistant.json"

# The target's system prompt (target/system-prompt.txt), declared for Lens.
[[declarations]]
path = "declarations/6c29ff4a9a7724383206a9224e1594b56a07d0699ca236044d503f701088a049"
